<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live Feedback · Review</title>
    <link rel="stylesheet" href="/app/styles.css" />
  </head>
  <body>
    <div id="shell">
      <header id="topbar">
        <div class="brand">Live Feedback</div>
        <div class="doc-title" id="doc-title">—</div>
        <div class="toolbar">
          <button id="copy-bryan" type="button">Copy Bryan link</button>
          <button id="copy-agent" type="button">Copy Agent link</button>
          <div id="me" class="user-chip"></div>
        </div>
      </header>
      <main id="main">
        <section id="editor-pane">
          <div id="format-bar" class="format-bar" role="toolbar" aria-label="Formatting">
            <button type="button" data-cmd="bold" title="Bold (⌘B)"><b>B</b></button>
            <button type="button" data-cmd="italic" title="Italic (⌘I)"><i>I</i></button>
            <span class="sep"></span>
            <button type="button" data-cmd="h1" title="Heading 1 (⌘⌥1)">H1</button>
            <button type="button" data-cmd="h2" title="Heading 2 (⌘⌥2)">H2</button>
            <button type="button" data-cmd="h3" title="Heading 3 (⌘⌥3)">H3</button>
            <span class="sep"></span>
            <button type="button" data-cmd="bulletList" title="Bulleted list">•&nbsp;List</button>
            <button type="button" data-cmd="orderedList" title="Numbered list">1.&nbsp;List</button>
            <button type="button" data-cmd="blockquote" title="Quote">❝</button>
            <span class="sep"></span>
            <button type="button" data-cmd="code" title="Inline code (⌘E)">&lt;&nbsp;&gt;</button>
            <button type="button" data-cmd="codeBlock" title="Code block">{…}</button>
            <button type="button" data-cmd="link" title="Link (⌘K)">🔗</button>
            <span class="sep"></span>
            <button type="button" data-cmd="hr" title="Horizontal rule">—</button>
            <button type="button" data-cmd="undo" title="Undo (⌘Z)">↶</button>
            <button type="button" data-cmd="redo" title="Redo (⌘⇧Z)">↷</button>
            <span class="spacer"></span>
            <button type="button" data-cmd="comment" class="primary" title="Comment on selection (⌘M)">
              💬&nbsp;Comment
            </button>
          </div>
          <div id="editor" class="prose"></div>
        </section>
        <aside id="threads-pane">
          <div class="threads-header">
            <h2>Threads</h2>
            <div class="legend">
              <span><i class="dot dot-open"></i>Open</span>
              <span><i class="dot dot-resolved"></i>Resolved</span>
              <span><i class="dot dot-orphan"></i>Orphaned</span>
            </div>
          </div>
          <div id="threads-list"></div>
        </aside>
      </main>
      <div id="composer" class="hidden">
        <div class="composer-inner">
          <div id="composer-snippet" class="snippet"></div>
          <textarea
            id="composer-text"
            placeholder="Leave a comment about this text…"
            rows="3"
          ></textarea>
          <div class="composer-actions">
            <button id="composer-cancel" type="button">Cancel</button>
            <button id="composer-submit" type="button" class="primary">Comment</button>
          </div>
        </div>
      </div>
      <div id="toast" class="hidden"></div>
    </div>
    <script type="module" src="/app/app.js"></script>
  </body>
</html>
