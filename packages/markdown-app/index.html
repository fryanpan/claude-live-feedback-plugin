<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <title>Workspaces · Review</title>
    <link rel="stylesheet" href="/app/styles.css" />
  </head>
  <body>
    <div id="shell">
      <header id="topbar">
        <div class="doc-crumb">
          <a href="/" class="back-link" title="All review docs" aria-label="Back to all review docs">←</a>
          <span class="doc-label">Editing:</span>
          <button
            type="button"
            id="doc-switcher"
            class="doc-switcher"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="doc-menu"
          >
            <span class="doc-path" id="doc-title">—</span>
            <span class="doc-switcher-caret" aria-hidden="true">▾</span>
          </button>
          <span id="save-state" class="save-state save-state--saved">All changes saved</span>
        </div>
        <div class="toolbar">
          <button
            type="button"
            id="toggle-edit-mode"
            class="icon-btn"
            title="Tap to switch to edit mode"
            aria-pressed="false"
            aria-label="Currently viewing — tap to switch to edit mode"
          >
            ✏️
          </button>
          <button
            type="button"
            id="toggle-suggest-mode"
            class="icon-btn"
            title="Tap to switch to Suggesting — edits become proposals"
            aria-pressed="false"
            aria-label="Suggesting off — tap to propose edits instead of making them"
          >
            ✍️
          </button>
          <button
            type="button"
            id="toggle-format"
            class="icon-btn"
            title="Show formatting (⌘⇧F)"
            aria-pressed="false"
            aria-label="Toggle formatting"
          >
            Aa
          </button>
          <!-- Walk the comments that render inline in the doc/source, in
               document order. Phone-only (the desktop margin/drawer shows
               them all at once), and deliberately to the LEFT of the badge
               below: the badge opens the whole list, these step through it. -->
          <button
            type="button"
            id="prev-comment"
            class="icon-btn comment-nav"
            title="Previous comment"
            aria-label="Previous comment"
          >
            ‹
          </button>
          <button
            type="button"
            id="next-comment"
            class="icon-btn comment-nav"
            title="Next comment"
            aria-label="Next comment"
          >
            ›
          </button>
          <button
            type="button"
            id="toggle-threads"
            class="icon-btn threads-toggle"
            title="Show comments"
            aria-pressed="false"
            aria-label="Toggle comments"
          >
            💬
            <span id="threads-count" class="badge">0</span>
          </button>
          <!-- Doc-level pending-suggestions affordance (redline-suggestions
               Phase 2). Hidden by default; mountSuggestionsSummary shows it
               once the doc has ≥1 pending proposal. Per-suggestion
               Accept/Reject lives on the balloon/chip card instead — this
               is Accept all / Reject all across every author. -->
          <button
            type="button"
            id="toggle-suggestions"
            class="icon-btn suggestions-toggle hidden"
            title="Pending suggestions"
            aria-haspopup="true"
            aria-expanded="false"
            aria-label="Pending suggestions"
          >
            ✎
            <span id="suggestions-count" class="badge">0</span>
          </button>
        </div>
      </header>
      <div
        id="suggestions-menu"
        class="suggestions-menu hidden"
        role="menu"
        aria-label="Pending suggestions"
        aria-hidden="true"
      >
        <button type="button" id="suggestions-accept-all" role="menuitem">Accept all</button>
        <button type="button" id="suggestions-reject-all" role="menuitem">Reject all</button>
      </div>
      <!-- Dropdown listing all docs in the current set. Anchored under
           the topbar; only shown when the doc has a setId. The same data
           also renders into #set-pane on desktop. -->
      <nav
        id="doc-menu"
        class="doc-menu hidden"
        role="menu"
        aria-label="Pick a doc in this review set"
        aria-hidden="true"
      ></nav>
      <main id="main">
        <!-- Persistent left sidebar for desktop. Empty + display:none
             unless the doc has a setId (then body.has-set toggles it
             visible and JS populates the list). On mobile (<1100px) the
             sidebar collapses to free up space; the dropdown above is
             the only nav. -->
        <aside id="set-pane" aria-label="Docs in this review set" aria-hidden="true">
          <div class="set-pane-header">In this review</div>
          <ol id="set-pane-list"></ol>
        </aside>
        <section id="editor-pane">
          <!-- Diff-review view toggle: redline vs unified diff vs whole file
               (live). Floats top-right of the editor; hidden except on diff
               docs (code-app / redline-app show it once the base text is
               available). Redline is markdown-only — hidden on other files. -->
          <div id="view-controls" class="view-controls">
            <div id="view-toggle" class="view-toggle hidden" role="group" aria-label="View mode">
              <button
                type="button"
                id="view-redline"
                class="view-toggle-btn hidden"
                aria-pressed="false"
              >
                Redline
              </button>
              <button
                type="button"
                id="view-diff"
                class="view-toggle-btn active"
                aria-pressed="true"
              >
                Diff
              </button>
              <button type="button" id="view-file" class="view-toggle-btn" aria-pressed="false">
                File
              </button>
            </div>
            <!-- Whitespace suppression. Not a view MODE, so it sits outside the
                 radio group above: it's an independent toggle, and it appears
                 only when this file actually has whitespace-only changes to
                 hide (or they're currently being shown). -->
            <button
              type="button"
              id="view-whitespace"
              class="view-toggle-btn ws-toggle hidden"
              aria-pressed="false"
            >
              Whitespace
            </button>
          </div>
          <div
            id="format-bar"
            class="format-bar is-collapsed"
            role="toolbar"
            aria-label="Formatting"
          >
            <button type="button" data-cmd="bold" title="Bold (⌘B)"><b>B</b></button>
            <button type="button" data-cmd="italic" title="Italic (⌘I)"><i>I</i></button>
            <span class="sep"></span>
            <button type="button" data-cmd="h1" title="Heading 1">H1</button>
            <button type="button" data-cmd="h2" title="Heading 2">H2</button>
            <button type="button" data-cmd="h3" title="Heading 3">H3</button>
            <span class="sep"></span>
            <button type="button" data-cmd="bulletList" title="Bulleted list">•&nbsp;List</button>
            <button type="button" data-cmd="orderedList" title="Numbered list">1.&nbsp;List</button>
            <button type="button" data-cmd="blockquote" title="Quote">❝</button>
            <span class="sep"></span>
            <button type="button" data-cmd="code" title="Inline code (⌘E)">&lt;&nbsp;&gt;</button>
            <button type="button" data-cmd="codeBlock" title="Code block">{…}</button>
            <button type="button" data-cmd="link" title="Link (⌘K)">🔗</button>
            <button
              type="button"
              data-cmd="table"
              title="Table"
              aria-haspopup="menu"
              aria-expanded="false"
            >
              ▦
            </button>
            <button type="button" data-cmd="hr" title="Horizontal rule">—</button>
            <span class="sep"></span>
            <button
              type="button"
              data-cmd="width"
              title="Toggle reading width (narrow ⇄ full)"
              aria-label="Toggle reading width"
              aria-pressed="false"
            >↔</button>
          </div>
          <div id="editor" class="prose"></div>
        </section>

        <!-- Small inline "comment" pill. Floats near the selection end
             (or the cursor when there's no selection) so the user doesn't
             lose sight of what they're commenting on and the iOS
             keyboard/menu don't collide with it. -->
        <button
          id="comment-pill"
          type="button"
          class="comment-pill hidden"
          aria-label="Add comment"
          title="Add comment"
        >
          💬
        </button>

        <aside id="threads-pane" aria-label="Comments" aria-hidden="true">
          <div class="threads-header">
            <div class="threads-title-row">
              <h2>Comments</h2>
              <button
                type="button"
                id="close-threads"
                class="icon-btn threads-close"
                title="Close"
                aria-label="Close comments"
              >
                ×
              </button>
            </div>
            <div class="threads-tabs" role="tablist">
              <button type="button" class="tab active" data-tab="open">Open</button>
              <button type="button" class="tab" data-tab="resolved">Resolved</button>
              <button type="button" class="tab" data-tab="all">All</button>
            </div>
          </div>
          <div id="threads-list"></div>
        </aside>
        <div id="threads-scrim" class="scrim" aria-hidden="true"></div>
      </main>
      <!-- Full-screen focused thread view (tap a highlight → see the thread
           like Notion's Diskussion sheet). -->
      <div
        id="thread-view"
        class="thread-view hidden"
        role="dialog"
        aria-label="Comment"
        aria-hidden="true"
      >
        <header class="thread-view-header">
          <span class="drag-handle" aria-hidden="true"></span>
          <h2 class="thread-view-title">Comment</h2>
          <button
            id="thread-view-close"
            type="button"
            class="icon-btn thread-view-close"
            title="Close"
            aria-label="Close thread"
          >
            ×
          </button>
        </header>
        <div id="thread-view-body" class="thread-view-body"></div>
        <div class="thread-view-reply">
          <textarea
            id="thread-view-reply-text"
            placeholder="Add a comment…"
            rows="1"
            autocapitalize="sentences"
          ></textarea>
          <button
            id="thread-view-reply-submit"
            type="button"
            class="submit-arrow"
            aria-label="Post reply"
          >
            ↑
          </button>
        </div>
      </div>

      <!-- Composer for creating a NEW thread on a selection. Dims the doc
           behind it so the selection stays visible. Shows a small, muted
           snippet of the anchored text so the user never loses sight of
           what they're commenting on when the iOS keyboard pushes the
           editor out of the viewport. -->
      <div id="composer-scrim" class="composer-scrim hidden" aria-hidden="true"></div>
      <div id="composer" class="hidden" role="dialog" aria-label="Leave a comment">
        <div id="composer-quote" class="composer-quote" aria-hidden="true"></div>
        <div class="composer-inner">
          <div id="composer-avatar" class="composer-avatar"></div>
          <textarea
            id="composer-text"
            placeholder="Add a comment…"
            rows="1"
            autocapitalize="sentences"
          ></textarea>
          <button
            id="composer-submit"
            type="button"
            class="submit-arrow"
            aria-label="Post comment"
          >
            ↑
          </button>
        </div>
      </div>
      <div id="toast" class="hidden"></div>
    </div>
    <script type="module" src="/app/app.js"></script>
  </body>
</html>
