<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>streamlined_review — mobile thread drawer</title>
<style>
  :root {
    --fg:#1b1f23; --fg-muted:#6e7781; --bg:#fff; --bg-panel:#f6f8fa;
    --border:#d1d5da; --border-strong:#afb8c1; --accent:#2e7dd7;
    --green:#2da44e; --yellow:#bf8700; --radius:6px; --t:250ms;
    --sans:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Text","Segoe UI",system-ui,sans-serif;
    --serif:Charter,"Iowan Old Style","Source Serif Pro",Georgia,serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);color:var(--fg);background:#e7ebef;padding:16px;
       -webkit-text-size-adjust:100%}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--fg-muted);font-size:13px;margin:0 0 14px;line-height:1.5}
  .wrap{max-width:462px;margin:0 auto}

  /* ---------- mockup chrome (not part of the product) ---------- */
  .controls{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;align-items:center}
  .controls button{font:inherit;font-size:12px;padding:4px 11px;border-radius:99px;
    border:1px solid var(--border);background:var(--bg);color:var(--accent);cursor:pointer}
  .controls button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .controls .sep{font-size:11.5px;color:var(--fg-muted);margin-left:4px}
  .legend{font-size:12.5px;color:var(--fg-muted);line-height:1.55;margin:12px 0 0;min-height:52px}
  .legend b{color:var(--fg);font-weight:600}

  /* ---------- device ---------- */
  .device{background:#15181c;border-radius:40px;padding:11px;
          box-shadow:0 10px 34px rgba(15,20,26,.28);width:452px;max-width:100%}
  .screen{position:relative;background:var(--bg);border-radius:30px;overflow:hidden;height:760px}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:118px;height:24px;
         background:#15181c;border-radius:0 0 15px 15px;z-index:9}
  .statusbar{display:flex;align-items:center;justify-content:space-between;padding:7px 22px 3px;
             font-size:11.5px;font-weight:600;background:var(--bg)}
  .scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}

  .appbar{display:flex;align-items:center;gap:6px;padding:9px 12px;background:var(--bg);
    border-bottom:1px solid var(--border);position:sticky;top:0;z-index:4}
  .appbar .title{font-weight:600;font-size:13.5px;flex:1;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .navbtn{font:inherit;font-size:15px;line-height:1;width:30px;height:30px;border-radius:var(--radius);
    border:1px solid var(--border);background:var(--bg);color:var(--fg-muted);cursor:pointer}
  .navbtn:active{background:var(--bg-panel)}
  .navbtn[disabled]{opacity:.35;cursor:default}
  .badge{font:inherit;font-size:12px;font-weight:600;background:var(--accent);color:#fff;
    border:0;border-radius:99px;padding:4px 11px;cursor:pointer;min-width:34px}
  .badge:active{filter:brightness(.92)}

  .drawer-head{display:flex;align-items:center;gap:8px;padding:4px 14px 11px;background:transparent}
  .drawer-head .title{font-weight:600;font-size:13.5px;flex:1}
  .tab{font:inherit;font-size:11.5px;color:var(--fg-muted);padding:3px 9px;border-radius:99px;
       border:0;background:transparent;cursor:pointer}
  .tab.on{background:var(--accent);color:#fff}
  .section-heading{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--fg-muted);font-weight:600;padding:11px 14px 5px}
  .list{padding:0 10px 14px}

  /* ---------- card ---------- */
  .thread{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
          padding:9px 11px;margin-bottom:8px;position:relative;cursor:pointer;
          transition:border-color var(--t) ease, box-shadow var(--t) ease}
  .thread.orphan{border-left:3px solid var(--yellow)}
  .thread.resolved{opacity:.72}
  .thread.expanded{border-color:var(--border-strong);box-shadow:0 1px 3px rgba(20,24,28,.07)}
  .thread.flash{box-shadow:0 0 0 3px rgba(46,125,215,.35)}
  .row1{display:flex;align-items:center;gap:6px;font-size:12.5px;min-width:0}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto}
  .resolved .status-dot{background:var(--green)}
  .orphan .status-dot{background:var(--yellow)}
  .swatch{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
  .who{font-weight:600}.dim{color:var(--fg-muted)}
  .clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .topic{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--fg-muted);
         border-left:3px solid var(--border);padding:1px 8px;margin:0}
  .state{font-size:13px;margin:0;line-height:1.35}
  .state::before{content:"↳ ";color:var(--fg-muted)}
  .state.none{color:var(--fg-muted);font-style:italic}
  .state.none::before{content:""}

  /* The morph. Each slot holds two faces stacked in the same box; the slot's height is
     measured and tweened in JS, so nothing ever collapses to zero and nothing above the
     card moves. Slot A grows in place — the topic line becomes the first message where it
     already sits. Slot B is carried down by that growth (the translation), keeps its line
     intact for the whole trip, and only then cross-fades into the rest of the thread. */
  .slot{position:relative;overflow:hidden;margin-top:7px}
  .slot > .face{position:absolute;left:0;right:0;top:0}
  .face.detail{opacity:0;pointer-events:none}
  .thread.expanded .face.summary{opacity:0;pointer-events:none}
  .thread.expanded .face.detail{opacity:1;pointer-events:auto}
  /* The card header is the attribution for the opening message, so it isn't repeated. */
  .msg{font-size:13px;line-height:1.42}
  .face.detail > .cmt:first-child{margin-top:0}

  .cmt{display:flex;gap:7px;margin-top:9px;font-size:13px;line-height:1.42}
  .cmt .swatch{margin-top:4px}
  .cmt .body{min-width:0}
  .cmt .name{font-weight:600;font-size:12.5px}
  .cmt .when{color:var(--fg-muted);font-size:11.5px;margin-left:5px}
  .replybox{display:flex;gap:6px;margin-top:10px}
  .replybox input{flex:1;min-width:0;font:inherit;font-size:12.5px;padding:7px 9px;
    border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-panel)}
  .replybox input:focus{outline:none;border-color:var(--accent);background:var(--bg)}
  .replybox button{font:inherit;font-size:12.5px;padding:0 12px;border-radius:var(--radius);
    border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}

  .row4{display:flex;align-items:center;gap:8px;margin-top:9px}
  .meta{font-size:12px;color:var(--fg-muted);flex:1;overflow:hidden;text-overflow:ellipsis;
        white-space:nowrap}
  /* One resolve control, identical in summary and expanded. */
  .resolve{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12px;
    padding:5px 10px;border-radius:var(--radius);border:1px solid var(--border);
    background:var(--bg);color:var(--fg-muted);cursor:pointer;
    transition:background var(--t) ease,color var(--t) ease,border-color var(--t) ease}
  .resolve:hover{border-color:var(--green);color:var(--green);background:#f2fbf5}
  .thread.resolved .resolve{border-color:var(--green);background:var(--green);color:#fff}
  .chev{flex:0 0 auto;color:var(--fg-muted);font-size:16px;line-height:1;
        transition:transform var(--t) ease}
  .thread.expanded .chev{transform:rotate(90deg);color:var(--fg)}

  /* ---------- document + inline ---------- */
  .doc{padding:14px 16px 40px;font-family:var(--serif);font-size:15px;line-height:1.62}
  .doc h3{font-family:var(--sans);font-size:15px;margin:0 0 10px}
  .doc p{margin:0 0 13px}
  .anchored{background:#fff6d9;box-shadow:0 1px 0 #e8c65a inset,0 -1px 0 #e8c65a inset;
    border-radius:2px}
  .anchored.two{background:#e9f2fd;box-shadow:0 1px 0 #b9d5f5 inset,0 -1px 0 #b9d5f5 inset}
  .anchored.three{background:#eaf7ee;box-shadow:0 1px 0 #b4dfc2 inset,0 -1px 0 #b4dfc2 inset}
  .inline-wrap{margin:-4px 0 15px;padding-left:12px;border-left:2px solid #e8c65a;
    font-family:var(--sans)}
  .inline-wrap.two{border-left-color:#b9d5f5}
  .inline-wrap.three{border-left-color:#b4dfc2}
  .inline-wrap .thread{margin-bottom:0}

  /* ---------- over-doc modal ---------- */
  .scrim{position:absolute;inset:0;background:rgba(20,24,28,.34);z-index:7;
         animation:fade var(--t) ease}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg-panel);z-index:8;
    border-top:1px solid var(--border-strong);border-radius:14px 14px 0 0;
    box-shadow:0 -8px 30px rgba(0,0,0,.16);max-height:74%;overflow-y:auto;
    animation:rise var(--t) cubic-bezier(.2,.8,.3,1)}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .grabber{width:36px;height:4px;border-radius:99px;background:var(--border-strong);
    margin:8px auto 2px;cursor:pointer}

  /* ---------- code ---------- */
  .code{font-family:var(--mono);font-size:12px;line-height:1.65;padding:10px 0 40px}
  .ln{display:flex;gap:10px;padding:0 12px;white-space:pre;overflow-x:auto}
  .ln .num{color:#b6bec6;min-width:22px;text-align:right;flex:0 0 auto;user-select:none}
  .ln.hit{background:#fff6d9}
  .ln.hit.two{background:#e9f2fd}
  .k{color:#cf222e}.s{color:#0a3069}.c{color:#6e7781}.f{color:#8250df}
  .code .inline-wrap{margin:6px 10px 10px 34px;padding-left:10px}

  .callout{margin:16px 0 0;padding:10px 12px;border-left:3px solid var(--accent);
    background:#f2f7fd;font-size:12.5px;line-height:1.55;
    border-radius:0 var(--radius) var(--radius) 0}
  .callout b{color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">

<h1>streamlined_review — mobile</h1>
<p class="sub">The thread drawer at 430&nbsp;px. This is the surface you triage on.
Each card is four lines, hard-capped: every line clips with an ellipsis rather than wrapping.</p>

<div class="controls" id="controls"></div>

<div class="device">
  <div class="screen" id="screen"><div class="notch"></div></div>
</div>

<p class="legend" id="legend"></p>

<div class="callout" id="callout"></div>

</div>

<script>
/* Every card in every view is built by card() from this one array, so state is shared:
   resolve something in the sheet and the inline card is resolved too. */
const THREADS = [
  { id:'t1', file:'md', author:'Alex', color:'#2e7dd7', status:'open', hue:'',
    topic:'Error handling in the retry helper',
    state:'Debating whether to keep the fallback path', when:'2h ago',
    comments:[
      {who:'Alex',c:'#2e7dd7',when:'2h',text:'The retry loop swallows the underlying error, so a caller only ever sees the final timeout. We should rethrow on the last attempt.'},
      {who:'Sam',c:'#e36f1e',when:'2h',text:'Agreed. Do we keep the fallback path at all, or drop it?'},
      {who:'Jordan',c:'#8957e5',when:'1h',text:'Keep it — two callers still depend on the degraded response.'}]},
  { id:'t2', file:'md', author:'Sam', color:'#e36f1e', status:'open', hue:'two',
    topic:'Timeout applied per attempt, not overall',
    state:'Agreed to move it into the client wrapper', when:'25m ago',
    comments:[
      {who:'Sam',c:'#e36f1e',when:'40m',text:'Is the timeout applied across the whole operation or per attempt?'},
      {who:'Alex',c:'#2e7dd7',when:'32m',text:'Per attempt. Three retries can take 3× the budget.'},
      {who:'Sam',c:'#e36f1e',when:'28m',text:'That explains the p99. Move it into the client wrapper?'},
      {who:'Alex',c:'#2e7dd7',when:'25m',text:'Yes — wrapping is the smaller change.'}]},
  // No replies yet: a topic line, and no thread line to write.
  { id:'t3', file:'md', author:'Jordan', color:'#2da44e', status:'open', hue:'three',
    topic:'Jitter missing from the backoff', state:'', when:'8m ago',
    comments:[{who:'Jordan',c:'#2da44e',when:'8m',text:'No jitter here, so simultaneous failures retry in lockstep and hit the service as one wave.'}]},
  // Orphan and resolved have no line to sit beside — the sheet is the only place they appear.
  { id:'t4', file:'md', author:'Alex', color:'#8957e5', status:'orphan',
    topic:'Retry budget shared across both call sites',
    state:'Unresolved — the anchored line was deleted', when:'yesterday',
    comments:[
      {who:'Alex',c:'#8957e5',when:'1d',text:'Both call sites share one budget, so a noisy caller starves the other.'},
      {who:'Jordan',c:'#2da44e',when:'1d',text:'Worth splitting per call site.'}]},
  { id:'t5', file:'md', author:'Alex', color:'#2e7dd7', status:'resolved',
    topic:'Log line leaked the request body',
    state:'Fixed — body redacted before logging', when:'3h ago',
    comments:[
      {who:'Alex',c:'#2e7dd7',when:'3h',text:'This log line prints the whole request body, including auth headers.'},
      {who:'Sam',c:'#e36f1e',when:'3h',text:'Redacted before logging now.'}]},
  { id:'t6', file:'code', author:'Alex', color:'#2e7dd7', status:'open', hue:'',
    topic:'Empty catch hides every failure',
    state:'Settled on rethrowing the last error', when:'2h ago',
    comments:[
      {who:'Alex',c:'#2e7dd7',when:'2h',text:'This catch swallows the error — rethrow on the last attempt.'},
      {who:'Sam',c:'#e36f1e',when:'1h',text:'Agreed, and keep the original stack.'}]},
  { id:'t7', file:'code', author:'Sam', color:'#e36f1e', status:'open', hue:'two',
    topic:'Fixed attempt count, not configurable', state:'', when:'12m ago',
    comments:[{who:'Sam',c:'#e36f1e',when:'12m',text:'Three is hard-coded. Callers with a tighter budget cannot lower it.'}]},
];

let file = 'md', sheetOpen = false, filter = 'open', navIdx = -1, flashId = null;
const expanded = new Set(), resolved = new Set(['t5']);

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const statusOf = (t) => (resolved.has(t.id) ? 'resolved' : t.status);
const inFile = () => THREADS.filter((t) => t.file === file);
/* Inline-placeable = has a line to sit beside. Orphans and resolved do not. */
const inlineThreads = () => inFile().filter((t) => statusOf(t) === 'open' && t.hue !== undefined);
const openCount = () => inFile().filter((t) => statusOf(t) !== 'resolved').length;

function card(t) {
  const st = statusOf(t);
  const isOpen = expanded.has(t.id);
  const n = t.comments.length;
  const others = new Set(t.comments.map((c) => c.who));
  others.delete(t.author);
  const tag = st === 'orphan' ? '· orphan' : st === 'resolved' ? '· resolved' : '';
  const who = others.size ? ` · +${others.size} other${others.size > 1 ? 's' : ''}` : '';

  // Two generated lines, always both, everywhere — what the thread is ABOUT, then where
  // the discussion GOT TO. A thread with no replies has no discussion yet, so the second
  // line says so rather than inventing one or collapsing to a single line.
  //
  // Each line is paired with what it becomes: the topic with the opening message, the
  // discussion line with the replies. That pairing is what the morph animates.
  const cmt = (c) => `<div class="cmt"><span class="swatch" style="background:${c.c}"></span>
    <div class="body"><span class="name">${esc(c.who)}</span><span class="when">${c.when}</span>
    <div>${esc(c.text)}</div></div></div>`;

  const slotA = `
    <div class="slot a">
      <div class="face summary"><div class="topic clip">${esc(t.topic)}</div></div>
      <div class="face detail"><div class="msg">${esc(t.comments[0].text)}</div></div>
    </div>`;

  const slotB = `
    <div class="slot b">
      <div class="face summary">${
        n > 1
          ? `<div class="state clip">${esc(t.state)}</div>`
          : `<div class="state none clip">No replies yet</div>`
      }</div>
      <div class="face detail">
        ${t.comments.slice(1).map(cmt).join('')}
        <div class="replybox"><input placeholder="Reply…" data-reply="${t.id}" />
          <button data-send="${t.id}">Send</button></div>
      </div>
    </div>`;

  return `<div class="thread ${st} ${isOpen ? 'expanded' : ''} ${flashId === t.id ? 'flash' : ''}"
    data-id="${t.id}">
    <div class="row1 clip"><span class="status-dot"></span>
      <span class="swatch" style="background:${t.color}"></span>
      <span class="who">${esc(t.author)}</span><span class="dim">${tag}${who}</span></div>
    ${slotA}${slotB}
    <div class="row4">
      <span class="meta">${n > 1 ? `${n - 1} repl${n - 1 === 1 ? 'y' : 'ies'} · ` : ''}${t.when}</span>
      <button class="resolve" data-resolve="${t.id}">✓ ${st === 'resolved' ? 'Resolved' : 'Resolve'}</button>
      <span class="chev">›</span>
    </div></div>`;
}

function sheetBody() {
  const groups = [
    ['Open', inFile().filter((t) => statusOf(t) === 'open')],
    ['Orphaned — no line to anchor to', inFile().filter((t) => statusOf(t) === 'orphan')],
    ['Resolved', filter === 'all' ? inFile().filter((t) => statusOf(t) === 'resolved') : []],
  ].filter(([, ts]) => ts.length);

  return groups
    .map(
      ([name, ts]) => `<div class="section-heading">${name} (${ts.length})</div>
      <div class="list">${ts.map((t) => card(t)).join('')}</div>`,
    )
    .join('');
}

function docBody() {
  const at = (id) => {
    const t = THREADS.find((x) => x.id === id);
    return `<div class="inline-wrap ${t.hue}">${card(t)}</div>`;
  };
  return `<div class="doc"><h3>Retry policy</h3>
    <p>Requests are retried up to three times with exponential backoff.
    <span class="anchored">The retry loop swallows the underlying error</span>, so a caller
    sees only the final timeout.</p>
    ${at('t1')}
    <p>Only idempotent operations are retried. A write that has already been accepted by the
    upstream is never re-sent, even when the response never arrives — the caller gets the
    timeout and decides for itself.</p>
    <p><span class="anchored two">The timeout is applied per attempt</span> rather than across
    the whole operation, which means a slow endpoint can still exceed the budget.</p>
    ${at('t2')}
    <p>The budget is measured from the first attempt, not from the moment the request is
    queued. Under load the queue wait is the larger term, and it is invisible here.</p>
    <p>Failures are classified before they are retried: connection errors and 5xx responses
    are retried, 4xx responses are not, and a 429 is retried only when the response carries a
    Retry-After header we can honour.</p>
    <p>Backoff starts at 200&nbsp;ms and doubles.
    <span class="anchored three">Jitter is not applied</span>, so simultaneous failures retry
    in lockstep.</p>
    ${at('t3')}
    <p>A caller that needs a hard deadline should wrap the whole operation rather than relying
    on the per-attempt timeout.</p>
    <p>Retries are counted per logical operation, not per socket. A connection that is
    re-established mid-operation does not reset the count.</p></div>`;
}

function codeBody() {
  const at = (id) => {
    const t = THREADS.find((x) => x.id === id);
    return `<div class="inline-wrap ${t.hue}">${card(t)}</div>`;
  };
  const L = (n, html, hit) =>
    `<div class="ln ${hit || ''}"><span class="num">${n}</span><span>${html}</span></div>`;
  return `<div class="code">
    ${L(34, '<span class="c">// Retries an idempotent operation with exponential backoff.</span>')}
    ${L(35, '<span class="k">const</span> BASE_MS = 200;')}
    ${L(36, '')}
    ${L(37, '<span class="k">function</span> <span class="f">backoff</span>(attempt: <span class="f">number</span>) {')}
    ${L(38, '  <span class="k">return</span> BASE_MS * 2 ** attempt;')}
    ${L(39, '}')}
    ${L(40, '')}
    ${L(41, '<span class="k">async function</span> <span class="f">withRetry</span>&lt;T&gt;(fn: () =&gt; <span class="f">Promise</span>&lt;T&gt;) {')}
    ${L(42, '  <span class="k">for</span> (<span class="k">let</span> i = 0; i &lt; 3; i++) {', 'hit two')}
    ${at('t7')}
    ${L(43, '    <span class="k">try</span> { <span class="k">return await</span> fn(); }')}
    ${L(44, '    <span class="k">catch</span> { <span class="c">/* keep trying */</span> }', 'hit')}
    ${at('t6')}
    ${L(45, '    <span class="k">await</span> <span class="f">sleep</span>(<span class="f">backoff</span>(i));')}
    ${L(46, '  }')}
    ${L(47, '  <span class="k">throw new</span> <span class="f">Error</span>(<span class="s">\'retries exhausted\'</span>);')}
    ${L(48, '}')}
    ${L(49, '')}
    ${L(50, '<span class="k">export</span> { withRetry, backoff };')}
  </div>`;
}

const VIEWS = [
  ['md', 'Markdown'],
  ['code', 'Source'],
];
const LEGEND = {
  md: '<b>Inline in the document.</b> Cards sit under the text they point at, collapsed: what the thread is about, then where the discussion got to. Tap the badge for the over-doc sheet, or ‹ › to walk comment to comment.',
  code: '<b>Inline in source.</b> Same placement as a GitHub PR comment. Code scrolls sideways; the card does not, so it never needs a horizontal scroll to read.',
};

function render() {
  const bar = `<div class="statusbar"><span>9:41</span><span>▮▮▮ ⌁ 100%</span></div>`;
  const title = file === 'md' ? 'retry-policy.md' : 'retry.ts';
  const nav = inlineThreads();
  const appbar = `<div class="appbar">
      <span class="title">${title}</span>
      <button class="navbtn" data-nav="-1" aria-label="Previous comment" ${nav.length < 2 ? 'disabled' : ''}>‹</button>
      <button class="navbtn" data-nav="1" aria-label="Next comment" ${nav.length < 2 ? 'disabled' : ''}>›</button>
      <button class="badge" data-sheet="open" aria-label="All comments">${openCount()}</button>
    </div>`;

  document.getElementById('screen').innerHTML = `<div class="notch"></div>
    <div class="scroll">${bar}${appbar}${file === 'md' ? docBody() : codeBody()}</div>
    ${
      sheetOpen
        ? `<div class="scrim" data-sheet="close"></div>
           <div class="sheet"><div class="grabber" data-sheet="close"></div>
             <div class="drawer-head"><span class="title">${title}</span>
               <button class="tab ${filter === 'open' ? 'on' : ''}" data-filter="open">Open</button>
               <button class="tab ${filter === 'all' ? 'on' : ''}" data-filter="all">All</button>
             </div>${sheetBody()}</div>`
        : ''
    }`;

  document.getElementById('legend').innerHTML = LEGEND[file];
  document.getElementById('controls').innerHTML =
    VIEWS.map(
      ([v, label]) => `<button data-view="${v}" class="${v === file ? 'on' : ''}">${label}</button>`,
    ).join('') + `<span class="sep">← which file you're reading (mockup control)</span>`;
  document.getElementById('callout').innerHTML = CALLOUT;
  sizeSlots();
}

const CALLOUT = `<b>What changed from your comments.</b>
  The standalone drawer view is gone — inline is the surface, and the sheet is what the badge
  opens over it. ‹ › walk comment to comment. Expanding morphs in place over 250&nbsp;ms: the
  topic line grows into the opening message where it already sits, and the discussion line
  rides down ahead of it before cross-fading into the replies. One <b>✓ Resolve</b> control, same
  colour in summary and expanded.<br /><br />
  <b>Two things I could not decide for you.</b>
  A resolved thread still has a card inline, sitting in the middle of the prose — in the sheet it
  simply leaves the Open list. Should it disappear inline?
  And a real reply won't have its summary line for ~5s while the model runs, so the line is stale
  for a moment after you speak; a pending state may be worth the flicker.`;

document.addEventListener('click', (e) => {
  const v = e.target.closest('[data-view]');
  if (v) {
    file = v.dataset.view;
    sheetOpen = false;
    navIdx = -1;
    return render();
  }

  const f = e.target.closest('[data-filter]');
  if (f) {
    filter = f.dataset.filter;
    return render();
  }

  const s = e.target.closest('[data-sheet]');
  if (s) {
    sheetOpen = s.dataset.sheet === 'open';
    return render();
  }

  const nv = e.target.closest('[data-nav]');
  if (nv) return step(Number(nv.dataset.nav));

  const r = e.target.closest('[data-resolve]');
  if (r) {
    const id = r.dataset.resolve;
    resolved.has(id) ? resolved.delete(id) : resolved.add(id);
    expanded.delete(id);
    return render();
  }

  if (e.target.closest('[data-send]')) return post(e.target.closest('[data-send]').dataset.send);
  if (e.target.closest('.replybox')) return; // don't collapse while typing

  const t = e.target.closest('.thread');
  if (t) toggle(t.dataset.id);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.dataset?.reply) post(e.target.dataset.reply);
});

/* Slots are absolutely positioned inside, so their height only exists because we set it.
   Re-measure after every render, and again when the width changes (a reflow changes how
   many lines a message takes). */
function faceOf(slot) {
  return slot.querySelector(
    slot.closest('.thread').classList.contains('expanded') ? '.face.detail' : '.face.summary',
  );
}

function sizeSlots(root = document) {
  for (const slot of root.querySelectorAll('.slot')) {
    slot.style.height = `${faceOf(slot).offsetHeight}px`;
  }
}

const MS = 250;
const EASE = 'cubic-bezier(.22,.72,.24,1)';

/* Toggle in place rather than re-rendering: a fresh node would mount at its final height
   and never animate. A thread can be on screen twice (inline and in the sheet), so drive
   every copy from the id. */
function toggle(id) {
  const open = !expanded.has(id);
  open ? expanded.add(id) : expanded.delete(id);
  for (const el of document.querySelectorAll(`.thread[data-id="${id}"]`)) morph(el, open);
}

/* Two phases, deliberately overlapping only slightly:
     A (0 → 62%)    the topic line grows in place and cross-fades into the opening message
     B (38% → 100%) the discussion line — which phase A has just carried downwards, intact —
                    cross-fades into the replies
   Reversed on collapse, so the thread retreats back into the two lines it came from. */
function morph(card, open) {
  card.classList.toggle('expanded', open);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const span = reduce ? 0 : MS * 0.62;
  const lag = reduce ? 0 : MS * 0.38;
  slide(card.querySelector('.slot.a'), span, open ? 0 : lag);
  slide(card.querySelector('.slot.b'), span, open ? lag : 0);
}

/* The class flip has already set the resting state; these keyframes hold the OLD values
   through `delay` (fill: backwards) and then tween to the new ones, which is what lets
   slot B sit still and simply travel while slot A is still growing. */
function slide(slot, dur, delay) {
  const from = slot.getBoundingClientRect().height;
  const arriving = faceOf(slot);
  const leaving = slot.querySelector(arriving.classList.contains('detail') ? '.face.summary' : '.face.detail');
  const to = arriving.offsetHeight;
  slot.style.height = `${to}px`;
  if (!dur) return;
  const opts = { duration: dur, delay, easing: EASE, fill: 'backwards' };
  slot.animate([{ height: `${from}px` }, { height: `${to}px` }], opts);
  arriving.animate([{ opacity: 0 }, { opacity: 1 }], opts);
  // Out faster than in, so the two texts never read as one overlapping smear.
  leaving.animate([{ opacity: 1 }, { opacity: 0 }], { ...opts, duration: dur * 0.6 });
}

/* Where a card has to sit for the jump to feel like "go to that comment": centred in
   the phone's own scroller, clamped to its range. Pure, so it can be checked. */
function centreOn(sc, el) {
  const max = Math.max(0, sc.scrollHeight - sc.clientHeight);
  return Math.max(0, Math.min(max, el.offsetTop - sc.clientHeight / 2 + el.offsetHeight / 2));
}

function step(dir) {
  const nav = inlineThreads();
  if (!nav.length) return;
  navIdx = (navIdx + dir + nav.length) % nav.length;
  const t = nav[navIdx];
  flashId = t.id;
  render();
  // scrollIntoView() would walk up and scroll the page behind the device frame too,
  // so centre it inside the phone's own scroller by hand.
  const sc = document.querySelector('.scroll');
  const inlineCard = () => sc?.querySelector(`.thread[data-id="${t.id}"]`);
  const el = inlineCard();
  if (sc && el) sc.scrollTo({ top: centreOn(sc, el), behavior: 'smooth' });
  setTimeout(() => {
    flashId = null;
    inlineCard()?.classList.remove('flash');
  }, 900);
}

function post(id) {
  const input = document.querySelector(`[data-reply="${id}"]`);
  const text = input?.value.trim();
  if (!text) return;
  const t = THREADS.find((x) => x.id === id);
  t.comments.push({ who: 'Bryan', c: '#2e7dd7', when: 'now', text });
  t.state = text.length > 44 ? `${text.slice(0, 44)}…` : text; // stands in for the model line
  t.when = 'just now';
  render();
}

render();
// A slot's height is measured, so anything that changes text metrics after first paint
// (a webfont landing, a rotation) has to re-measure or cards keep a stale height.
addEventListener('resize', () => sizeSlots());
document.fonts?.ready.then(() => sizeSlots());
</script>

<claude-feedback-widget doc-id="streamlined-review-mobile" user="bryan"></claude-feedback-widget>
<script src="/widget.iife.js"></script>
</body>
